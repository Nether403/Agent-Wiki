name: "Anti-Slop & Design Guardrail Audit"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/registry/**"
      - "components/**"
      - "apps/docs/public/r/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "packages/registry/**"
      - "components/**"
      - "apps/docs/public/r/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-guardrails:
    name: "Enforce Anti-Slop & WCAG Guardrails"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python Anti-Slop & WCAG Guardrail Scanner
        run: |
          python3 verify-audit.py packages/registry/src

      - name: Run Audit Linter Quality Gate
        run: |
          pnpm lint:slop

      - name: Verify Harvester Registry Compilation
        run: |
          pnpm build:registry

      - name: Run Agent MCP Sandbox Integration Tests
        run: |
          pnpm --filter @design-wiki/mcp test:sandbox
          pnpm tsx scripts/run-agent-sandbox.ts
