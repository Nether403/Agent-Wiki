name: 🛡️ Anti-Slop & Design Audit Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-guardrails:
    name: Anti-Slop AST Linter & Taste Dials
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Registry & Packages
        run: pnpm build

      - name: 🛡️ Run Anti-Slop 21-Rule AST Audit Gate
        run: python3 verify-audit.py --strict

      - name: 🎛️ Run Taste-Dial Calibration & Consistency Audit
        run: pnpm review:taste

      - name: 🕸️ Run Dynamic DAG Dependency Graph Verification
        run: pnpm harvest graph packages/registry/src

      - name: ♿ Run Automated Accessibility (WCAG AA) Checks
        run: pnpm test:a11y

      - name: 🤖 Execute Zero-Draft Sandbox Trial
        run: pnpm test:sandbox
