name: Anti-Slop & Design Audit Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-guardrails:
    name: Catalog truth, slop rules, MCP sandbox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and registry
        run: pnpm build

      - name: Assert catalog counts and MCP contract
        run: pnpm assert:catalog

      - name: Anti-slop rulepack on tooling packages
        run: pnpm lint:slop packages/mcp-server/src && pnpm lint:slop packages/cli/src

      - name: Taste-dial consistency
        run: pnpm review:taste

      - name: Registry dependency graph
        run: pnpm harvest graph packages/registry/src

      - name: Registry a11y metadata heuristics
        run: pnpm test:a11y

      - name: MCP stdio sandbox
        run: pnpm test:sandbox

      - name: Agent rulepack files
        run: pnpm test:agents
